<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniSport.UTeM</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f5f5f5;
        }

        /* ── HEADER ── */
        header {
            background-color: #0f2044;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 56px;
            position: relative;
        }

        .btn-help {
            background-color: #f5c518;
            color: #0f2044;
            border: none;
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-help:hover { background-color: #e0b310; }

        .logo {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-login, .btn-signup {
            border-radius: 20px;
            padding: 8px 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-signup {
            background-color: white;
            color: #0f2044;
            border: 2px solid white;
        }
        .btn-signup:hover { background-color: #e8e8e8; }

        .btn-login {
            background-color: transparent;
            color: white;
            border: 2px solid white;
        }
        .btn-login:hover { background-color: #ffffff22; }

        /* ── CAROUSEL ── */
        .img-section {
            padding: 30px 20px 20px;
        }

        .img-wrapper {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: nowrap;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .img-wrapper::-webkit-scrollbar { display: none; }

        .img-item {
            flex: 0 0 220px;
            height: 200px;
            border-radius: 14px;
            overflow: hidden;
            background: #ddd;
        }

        .img-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ── SEARCH SECTION ── */
        .search-section {
            padding: 40px 20px 60px;
            text-align: center;
        }

        .search-section h2 {
            font-size: 32px;
            font-weight: 900;
            color: #111;
            margin-bottom: 20px;
            text-align: left;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            border-radius: 12px;
            padding: 14px 16px;
            max-width: 700px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-bar-inner {
            flex: 1;
            text-align: left;
        }

        .search-bar-inner label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #333;
            margin-bottom: 2px;
        }

        .search-bar-inner input {
            border: none;
            outline: none;
            font-size: 14px;
            color: #888;
            width: 100%;
            background: transparent;
        }

        .search-btn {
            background-color: #0f2044;
            border: none;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .search-btn:hover { background-color: #1a3565; }
        .search-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <button class="btn-help">Help</button>
        <div class="logo">UniSport</div>
        <div class="btn-group">
            <button class="btn-signup">Sign Up</button>
            <button class="btn-login">Log In</button>
        </div>
    </header>

    <!-- CAROUSEL -->
    <section class="img-section">
        <div class="img-wrapper">
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 1">
            </div>
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 2">
            </div>
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 3">
            </div>
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 4">
            </div>
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 5">
            </div>
            <div class="img-item">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/24701-nature-natural-beauty.jpg/1280px-24701-nature-natural-beauty.jpg" alt="Sport 6">
            </div>
        </div>
    </section>

    <!-- SEARCH -->
    <section class="search-section">
        <h2>FIND YOUR</h2>
        <div class="search-bar">
            <div class="search-bar-inner">
                <label>Location</label>
                <input type="text" placeholder="Which type of facility...">
            </div>
            <button class="search-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M21 19l-4.35-4.35A7.5 7.5 0 1 0 15 16.65L19.35 21 21 19zM10.5 16a5.5 5.5 0 1 1 0-11 5.5 5.5 0 0 1 0 11z"/>
                </svg>
            </button>
        </div>
    </section>

</body>
</html>
